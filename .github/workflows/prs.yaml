name: Run test & build on PRs
on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
jobs:
  build:
    name: Compile and test PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"
      - uses: gradle/gradle-build-action@v3.5.0
      - name: Test & build
        run: ./gradlew test installDist
